{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="mb-4">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <span class="text-secondary small text-uppercase" style="letter-spacing: 0.08em;">Question {{ question_id }} of {{ total }}</span>
        <span class="text-warning small fw-bold">Preflop Quiz</span>
      </div>
      <div class="progress" style="height: 4px; background: rgba(255,255,255,0.1);">
        <div class="progress-bar bg-warning" style="width: {{ (question_id / total * 100) | int }}%;"></div>
      </div>
    </div>
    <div class="p-4 rounded-3 mb-4" style="background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);">
      <h2 class="fw-bold mb-4">{{ question.question }}</h2>

      <div class="d-flex flex-column gap-3" id="options-container">
        {% for option in question.options %}
        <button class="btn text-start p-3 rounded-3 option-btn"
                style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); color: #fff;"
                data-index="{{ loop.index0 }}"
                onclick="selectAnswer({{ loop.index0 }})">
          <span class="fw-bold text-warning me-2">{{ ['A', 'B', 'C', 'D'][loop.index0] }}.</span>
          {{ option }}
        </button>
        {% endfor %}
      </div>
    </div>
    <div id="feedback" class="p-4 rounded-3 mb-4" style="display: none;">
      <p class="fw-bold mb-1" id="feedback-title"></p>
      <p class="text-secondary mb-0" id="feedback-explanation"></p>
    </div>
    <div class="d-flex justify-content-between align-items-center mt-3">
      <a href="{{ url_for('learn', lesson_id=1) }}" class="btn btn-outline-secondary px-4">&#8592; Back to Lessons</a>
      <button id="next-btn" class="btn btn-success btn-lg px-5 fw-bold" style="display: none;"
              onclick="goNext()">
        {% if question_id < total %}Next Question &#8594;{% else %}See Results &#8594;{% endif %}
      </button>
    </div>
  </div>
</div>

<script>
const correctIndex = {{ question.answer }};
const questionId   = {{ question_id }};
const explanation  = {{ question.explanation | tojson }};
let answered = false;

function selectAnswer(selectedIndex) {
  if (answered) return;
  answered = true;

  const isCorrect = selectedIndex === correctIndex;

  document.querySelectorAll('.option-btn').forEach(function(btn) {
    const idx = parseInt(btn.dataset.index);
    btn.disabled = true;
    if (idx === correctIndex) {
      btn.style.background = 'rgba(25,135,84,0.25)';
      btn.style.borderColor = '#198754';
    } else if (idx === selectedIndex && !isCorrect) {
      btn.style.background = 'rgba(220,53,69,0.25)';
      btn.style.borderColor = '#dc3545';
    }
  });

  const feedback = document.getElementById('feedback');
  const title    = document.getElementById('feedback-title');
  const expl     = document.getElementById('feedback-explanation');

  feedback.style.display = 'block';
  if (isCorrect) {
    feedback.style.background = 'rgba(25,135,84,0.1)';
    feedback.style.border     = '1px solid rgba(25,135,84,0.4)';
    title.innerHTML = '✓ Correct!';
    title.className = 'fw-bold mb-1 text-success';
  } else {
    feedback.style.background = 'rgba(220,53,69,0.1)';
    feedback.style.border     = '1px solid rgba(220,53,69,0.4)';
    title.innerHTML = '✗ Not quite.';
    title.className = 'fw-bold mb-1 text-danger';
  }
  expl.textContent = explanation;

  $.post("/submit_answer", { question_id: questionId, answer: selectedIndex }, function() {
    document.getElementById('next-btn').style.display = 'inline-block';
  });
}

function goNext() {
  {% if question_id < total %}
  window.location.href = "{{ url_for('quiz', question_id=question_id + 1) }}";
  {% else %}
  window.location.href = "{{ url_for('result') }}";
  {% endif %}
}
</script>

{% endblock %}
